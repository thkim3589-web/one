<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>현장 ENG시트 입력</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0F2A4A">
<style>
  :root{
    --navy:#0F2A4A;
    --navy-light:#1B3F68;
    --amber:#E8871E;
    --amber-dark:#C96F0F;
    --bg:#F2F4F7;
    --card:#FFFFFF;
    --line:#DDE3EA;
    --text:#1B2430;
    --muted:#6B7684;
    --ok:#1E8E5A;
    --warn:#C0392B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    padding-bottom:76px;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:14px 16px 12px;
    position:sticky;
    top:0;
    z-index:20;
  }
  header h1{
    margin:0;
    font-size:16px;
    font-weight:700;
    letter-spacing:-.2px;
  }
  header p{
    margin:2px 0 0;
    font-size:12px;
    color:#B9C7D6;
  }
  #saveStatus{
    font-size:11px;
    color:#9FD6B4;
    margin-top:4px;
    min-height:14px;
  }
  main{
    padding:12px;
    max-width:720px;
    margin:0 auto;
  }
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  .section{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 14px;
    cursor:pointer;
    user-select:none;
  }
  .section-head h2{
    margin:0;
    font-size:14.5px;
    font-weight:700;
  }
  .section-head .chev{
    color:var(--muted);
    transition:transform .15s ease;
    font-size:13px;
  }
  .section.open .chev{transform:rotate(180deg);}
  .section-body{
    display:none;
    padding:2px 14px 14px;
    border-top:1px solid var(--line);
  }
  .section.open .section-body{display:block;}

  .field{margin-top:12px;}
  .field:first-child{margin-top:6px;}
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:600;
    color:var(--navy);
    margin-bottom:5px;
  }
  .field .hint{
    display:block;
    font-size:11px;
    font-weight:400;
    color:var(--muted);
    margin-top:2px;
  }
  input[type=text], select, textarea{
    width:100%;
    padding:10px 11px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14.5px;
    background:#FBFCFD;
    color:var(--text);
    font-family:inherit;
  }
  textarea{min-height:70px;resize:vertical;line-height:1.4;}
  input[type=text]:focus, select:focus, textarea:focus{
    outline:none;border-color:var(--navy-light);background:#fff;
  }

  .pillrow{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:999px;
    font-size:13px;
    background:#FBFCFD;
    cursor:pointer;
    color:var(--text);
  }
  .pill.selected{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
    font-weight:600;
  }

  .checkrow{
    display:flex;
    align-items:center;
    gap:9px;
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .checkrow:last-child{border-bottom:none;}
  .checkrow input[type=checkbox]{width:19px;height:19px;flex:none;}
  .checkrow span{font-size:13.5px;}

  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{
    flex:1;padding:9px 6px;border:none;background:#FBFCFD;font-size:13px;color:var(--text);
    font-family:inherit;
  }
  .seg button.active.a{background:var(--warn);color:#fff;font-weight:600;}
  .seg button.active.b{background:var(--ok);color:#fff;font-weight:600;}
  .seg button + button{border-left:1px solid var(--line);}

  .navbar{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;
    background:var(--card);
    border-top:1px solid var(--line);
    box-shadow:0 -2px 10px rgba(0,0,0,.05);
    z-index:30;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .navbar button{
    flex:1;padding:10px 4px 8px;border:none;background:none;
    font-family:inherit;font-size:12px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .navbar button .ic{font-size:19px;}
  .navbar button.active{color:var(--navy);font-weight:700;}

  .btn{
    display:block;width:100%;padding:13px;border:none;border-radius:9px;
    font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;text-align:center;
  }
  .btn-primary{background:var(--amber);color:#fff;}
  .btn-primary:active{background:var(--amber-dark);}
  .btn-secondary{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
  .btn-danger{background:#fff;color:var(--warn);border:1.5px solid var(--warn);}

  .card-static{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:14px;margin-bottom:12px;
  }
  .card-static h3{margin:0 0 8px;font-size:14px;}
  .card-static .row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px dashed var(--line);}
  .card-static .row:last-child{border-bottom:none;}
  .card-static .row b{color:var(--navy);}

  .photo-add{
    display:flex;align-items:center;justify-content:center;gap:8px;
    border:2px dashed var(--line);border-radius:10px;padding:22px 10px;
    color:var(--navy);font-weight:700;font-size:14px;background:#fff;margin-bottom:12px;
  }
  .photo-list{display:flex;flex-direction:column;gap:12px;}
  .photo-item{
    background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  }
  .photo-item img{width:100%;display:block;max-height:220px;object-fit:cover;background:#eee;}
  .photo-item .pbody{padding:10px 12px 12px;}
  .photo-item .prow{display:flex;gap:8px;margin-top:6px;}
  .photo-item .prow input{flex:1;}
  .photo-item .premove{
    margin-top:8px;background:none;border:none;color:var(--warn);font-size:12.5px;
    font-weight:600;padding:0;
  }
  .photo-count{font-size:12px;color:var(--muted);margin-bottom:10px;}
  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
    background:#1B2430;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;
    opacity:0;transition:opacity .25s ease;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;}
  .req::after{content:" *";color:var(--warn);}
  .gap{height:10px;}
</style>
</head>
<body>

<header>
  <h1>현장 ENG시트 입력</h1>
  <p>운용투자 Eng Sheet Check List · 모바일 입력</p>
  <div id="saveStatus"></div>
</header>

<main>
  <!-- 입력 탭 -->
  <div class="tabpanel active" id="tab-input">
    <div id="sections"></div>
  </div>

  <!-- 사진 탭 -->
  <div class="tabpanel" id="tab-photo">
    <div class="photo-count" id="photoCount"></div>
    <label class="photo-add" id="photoAddBtn">📷 사진 추가</label>
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" multiple>
    <div class="photo-list" id="photoList"></div>
  </div>

  <!-- 완료 탭 -->
  <div class="tabpanel" id="tab-done">
    <div class="card-static">
      <h3>입력 요약</h3>
      <div class="row"><span>공사명</span><b id="sumName">-</b></div>
      <div class="row"><span>현장주소</span><b id="sumAddr">-</b></div>
      <div class="row"><span>첨부 사진</span><b id="sumPhotos">0장</b></div>
      <div class="row"><span>마지막 임시저장</span><b id="sumSaved">-</b></div>
    </div>
    <button class="btn btn-primary" id="btnExport">엑셀로 내보내기</button>
    <div id="exportFallback" style="text-align:center;font-size:12.5px;min-height:18px;margin-top:2px;"></div>
    <p style="font-size:11.5px;color:var(--muted);text-align:center;margin:4px 0 0;">
      네이버·카카오 인앱 브라우저에서는 다운로드가 제한될 수 있어요.<br>
      안 되면 Chrome으로 열어서 다시 시도해보세요.
    </p>
    <div class="gap"></div>
    <button class="btn btn-secondary" id="btnSaveNow">지금 임시저장</button>
    <div class="gap"></div>
    <button class="btn btn-danger" id="btnReset">새 건으로 초기화</button>
  </div>
</main>

<nav class="navbar">
  <button data-tab="tab-input" class="active"><span class="ic">📝</span>입력</button>
  <button data-tab="tab-photo"><span class="ic">📷</span>사진</button>
  <button data-tab="tab-done"><span class="ic">✅</span>완료</button>
</nav>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
